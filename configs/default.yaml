# Single source of truth for every tunable in ATMC. Scripts and the demo app
# load this file; each results JSON stores a snapshot of the config it ran with,
# so any experiment can be reproduced from its own output file.

model:
  provider: gemini          # gemini | ollama (local open-weight model; see docs/LOCAL_MODEL.md)
  name: gemini-3.5-flash-lite
  temperature: 0.0            # README 4.2: deterministic reasoning where supported
  max_retries: 4
  request_interval_s: 4.5     # pacing for the free tier (15 requests/min)
  cache: true                 # reuse identical prompts (only active at temperature 0); saves API quota

embedding:
  backend: fastembed          # fastembed (local) | gemini (API) | tfidf (legacy baseline)
  model: BAAI/bge-small-en-v1.5      # fastembed model id
  gemini_model: gemini-embedding-001 # used only when backend: gemini

retrieval:
  top_k: 3
  show_kinds: null            # abstention by kind: e.g. [example, solved] shows only verified solutions (null = every kind)
  stale_radius: 0.75          # cosine within which older notes are demoted together when a stored solution is proven stale
  min_similarity: 0.0         # relevance floor (cosine); 0 = off. Notes below it are never injected.

trust:
  initial: 0.5                # starting trust before the verification check
  minimum: 0.30               # T_min: verification gate + retrieval filter
  reward: 0.05                # eta
  penalty: 0.15               # delta (must exceed reward)

decay:
  lambda_0: 0.1               # base decay rate
  alpha: 1.0                  # trust contribution to slowing decay
  beta: 1.0                   # importance contribution to slowing decay
  prune_every: 10             # additions between prune passes
  prune_min_retention: 0.05   # prune when retention factor F falls to this

composite:                    # must sum to 1.0
  w_trust: 0.4
  w_importance: 0.4
  w_decay: 0.2

compression:
  every: 8                    # additions between compression passes
  batch_size: 3               # memories merged into one summary
  min_age_steps: 5            # only memories at least this old are candidates
  evidence_merge: false       # fold similar failure-evidence notes into one 'rule card' (pilot/consolidate.py)
  evidence_threshold: 0.75    # task-embedding cosine above which two failure notes count as the same kind of problem
  evidence_max_lines: 6       # checker results kept on one card (newest)

pillars:                      # ablation switches (Importance is never switched off)
  trust: true
  forgetting: true
  compression: true

evaluation:
  dataset: pilot/data/gsm8k_test.jsonl
  n_tasks: 40
  seeds: [42, 123, 456]
  poison_every: 3             # poison every k-th task in the sequence
  heldout: 0                  # unseen tasks scored with frozen memory after training (0 = skip)

agent:
  domain: math                # math | code
  use_planner: false          # decompose the task before solving (1 extra LLM call per task)
  use_reflection: false       # LLM-written lesson after a failure (1 extra call per failure)
  curriculum: random          # fixed | random | weakness (practise where past failures cluster)
  curriculum_explore: 0.2     # chance of a random pick under 'weakness'
  evidence_note_trust: false  # a failure note that only states checker-verified facts (coding.note_style: evidence) enters
                              # memory with the trust of a verified note, not the lower trust of a failed attempt
  credit: cited               # cited | all | asymmetric. Who gets trust credit after an outcome: only notes the model
                              # reported using (cited); every retrieved note (all = the MemRL-style rule); or asymmetric
                              # (reward only cited notes on success, blame every retrieved note on failure)

strategy:                     # chat assistant: learns which way of solving works for each problem type
  enabled: true
  min_trials: 5               # evidence needed before a challenger can be promoted
  explore: 0.1                # chance a live question tries a less-tested strategy

autoverify:                   # chat assistant, tasks given without tests
  enabled: true
  candidates: 3               # independent solutions (the answer + alternatives)
  tests: 8                    # generated assert statements
  evidence_weight: 0.5        # trust moves half as much for generated-test evidence as for real tests

coding:
  datasets: [humaneval, mbpp]   # pool code tasks are sampled from
  timeout_s: 10               # wall-clock limit per test run in the sandbox
  note_style: full            # full | evidence. 'evidence': a failed attempt is stored as the checker's expected-vs-got
                              # (with types), without the wrong code, instead of the code plus the error text

app:
  n_sample_tasks: 20          # size of the fixed question pool in the side-by-side demo
  sample_seed: 42
  assistant_pool: 60          # tasks the autonomous assistant can choose from
  assistant:                  # the full agent shown in the Assistant tab
    use_planner: true
    use_reflection: true
    curriculum: weakness
